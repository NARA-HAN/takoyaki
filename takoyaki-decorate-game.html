<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>타꾸 - 타코야끼 꾸미기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#f3eee5;
    --panel:#fffdfa;
    --ink:#382f27;
    --ink-muted:#8a8074;
    --accent:#a8623f;
    --accent-soft:#ece1d6;
    --line:rgba(56,47,39,0.16);
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  body{
    background: var(--bg);
    font-family:'Pretendard', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 22px 12px 40px;
    min-height: 100vh;
  }

  .app{ width:100%; max-width: 420px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 22px 26px;
  }

  .hidden{ display:none !important; }

  h1{
    font-family:'Pretendard', sans-serif;
    font-weight: 800;
    font-size: 24px;
    text-align:center;
    line-height: 1.3;
  }
  h1 span{ color: var(--accent); }
  .sub{
    text-align:center;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-top: 6px;
  }

  #screen-start .mascot{ display:flex; justify-content:center; margin-bottom: 10px; }
  #screen-start .mascot img{
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 50%;
  }

  .primary-btn{
    display:block;
    width:100%;
    margin-top: 22px;
    background: var(--accent);
    color: #fff;
    font-family:'Pretendard', sans-serif;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 13px 0;
    cursor: pointer;
  }
  .primary-btn:active{ transform: scale(0.98); }

  .top-row{ display:flex; margin-bottom: 6px; }
  .back-btn{
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 13px;
    font-weight: 600;
    padding: 4px 0;
    cursor: pointer;
  }
  .back-btn:active{ opacity: 0.6; }

  #stage-slot-build, #stage-slot-result{ display:flex; justify-content:center; margin: 4px 0 8px; }

  .takoyaki-stage{ position: relative; width: 280px; height: 210px; }
  .tako-wrap{ position:absolute; left:0; top:0; width:210px; height:210px; }

  .drink-wrap-icon{
    position:absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 100px;
  }

  .tako-ball{
    position:absolute;
    inset: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #d99a5c, #b97a3c 55%, #8a571f 100%);
    box-shadow:
      inset -10px -14px 22px rgba(0,0,0,0.22),
      inset 8px 10px 18px rgba(255,220,170,0.3);
  }

  .layer{
    position:absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events:none;
  }
  .layer.visible{ opacity: 1; }

  .char-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .arm-left{ transform: rotate(10deg); transform-origin: 34px 120px; transition: transform 0.35s ease; }
  .arm-right{ transform: rotate(-10deg); transform-origin: 186px 120px; transition: transform 0.35s ease; }
  .takoyaki-stage.celebrate .arm-left{ transform: rotate(-58deg) translate(-3px,-10px); }
  .takoyaki-stage.celebrate .arm-right{ transform: rotate(58deg) translate(3px,-10px); }
  .mouth-default{ opacity:1; transition: opacity 0.2s ease; }
  .mouth-celebrate{ opacity:0; transition: opacity 0.2s ease; }
  .takoyaki-stage.celebrate .mouth-default{ opacity:0; }
  .takoyaki-stage.celebrate .mouth-celebrate{ opacity:1; }

  .speck{ position:absolute; border-radius: 50%; }
  .powder-katsuo .speck{ width:13px; height:6.5px; background:#d9b08c; border-radius: 40% 40% 50% 50%; box-shadow: inset 0 -2px 2px rgba(140,90,55,0.35);}
  .powder-parae .speck{ width:4px; height:4px; background:#3d5a3f; }
  .powder-cheese .speck{ width:5px; height:5px; background:#cf9f3f; }
  .fresh-pa .speck{ width:9px; height:5px; background:#6b8f5c; border-radius: 50%; }

  .sauce-svg{ width:100%; height:100%; overflow: visible; }

  .group{ margin-top: 18px; }
  .group-label{
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .pill-row{ display:flex; flex-wrap: wrap; gap: 8px; }
  .sub-label{
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
    margin: 10px 0 6px;
  }
  .pill-row + .sub-label{ margin-top: 10px; }
  .pill-btn{
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pill-btn.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  #screen-result .title-result{
    font-family:'Pretendard', sans-serif;
    font-size: 22px;
    font-weight: 800;
    text-align:center;
    color: var(--accent);
    margin-top: 8px;
  }
  #screen-result .desc-result{
    text-align:center;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-top: 6px;
  }
  .quip-result{
    text-align:center;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-radius: 12px;
    line-height: 1.5;
  }
  .drink-result{
    text-align:center;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 10px;
  }
  .capture-hint{
    text-align:center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-top: 14px;
  }
</style>
</head>

        <svg class="char-svg" viewBox="0 0 220 220">

      <div class="drink-wrap-icon">
        <div class="layer" data-drink-layer="beer">

            <rect x="10" y="30" width="32" height="54" rx="16" fill="url(#amberGrad)"/>

          <svg viewBox="0 0 60 100" width="100%" height="100%">
            <rect x="14" y="20" width="32" height="68" rx="16" fill="url(#goldGrad)"/>

            <circle cx="34" cy="50" r="6" fill="url(#iceGrad)"/>

          <svg viewBox="0 0 60 100" width="100%" height="100%">
            <rect x="12" y="22" width="32" height="66" rx="16" fill="url(#colaGrad)"/>

            <ellipse cx="18" cy="34" rx="4" ry="7" fill="#fff" opacity="0.25"/>
          </svg>
        </div>
        <div class="layer" data-drink-layer="greentea">
          <svg viewBox="0 0 60 100" width="100%" height="100%">
            <rect x="12" y="22" width="32" height="66" rx="16" fill="url(#teaGrad)"/>
            <path d="M34 8 L40 36" stroke="url(#limbGrad)" stroke-width="5" stroke-linecap="round"/>

    return stage;
  }

  function spec(points){
    return points.map(p => `<span class="speck" style="left:${p[0]}px; top:${p[1]}px; ${p[2]!==undefined?`transform:rotate(${p[2]}deg);`:''}"></span>`).join('');
  }

  const stageEl = buildStage();
  document.getElementById('stage-slot-build').appendChild(stageEl);

  const state = { sauce: new Set(), powder: new Set(), fresh: new Set() };
  const groupMap = { sauce: state.sauce, powder: state.powder, fresh: state.fresh };

  const DEFAULT_ON = ['sauce-tako', 'sauce-mayo', 'powder-katsuo', 'powder-parae'];

  function toggleLayer(btn){
    const group = btn.dataset.group;
    const layer = btn.dataset.layer;
    const set = groupMap[group];
    const layerEl = stageEl.querySelector(`[data-layer="${layer}"]`);

    if (set.has(layer)) {
      set.delete(layer);
      btn.classList.remove('active');
      layerEl.classList.remove('visible');
    } else {
      set.add(layer);
      btn.classList.add('active');
      layerEl.classList.add('visible');
    }
  }

  document.querySelectorAll('.pill-btn[data-layer]').forEach(btn => {
    btn.addEventListener('click', () => toggleLayer(btn));
    if (DEFAULT_ON.includes(btn.dataset.layer)) toggleLayer(btn);
  });

  let selectedDrink = null;
  const drinkNames = { beer:'맥주', highball:'하이볼', cola:'콜라', greentea:'녹차' };

  document.querySelectorAll('.drink-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const drink = btn.dataset.drink;
      document.querySelectorAll('.drink-btn').forEach(b => b.classList.remove('active'));
      stageEl.querySelectorAll('[data-drink-layer]').forEach(el => el.classList.remove('visible'));

      if (selectedDrink === drink) {
        selectedDrink = null;
      } else {
        selectedDrink = drink;
        btn.classList.add('active');
        stageEl.querySelector(`[data-drink-layer="${drink}"]`).classList.add('visible');
      }
    });
  });

  const screens = {
    start: document.getElementById('screen-start'),
    build: document.getElementById('screen-build'),
    result: document.getElementById('screen-result'),
  };

  document.getElementById('btn-start').addEventListener('click', () => {
    screens.start.classList.add('hidden');
    screens.build.classList.remove('hidden');
  });

  document.getElementById('btn-back').addEventListener('click', () => {
    screens.build.classList.add('hidden');
    screens.start.classList.remove('hidden');
  });

  document.getElementById('btn-finish').addEventListener('click', () => {
    document.getElementById('stage-slot-result').appendChild(stageEl);
    const { title, desc, quip } = getTitle();
    document.getElementById('result-title').textContent = title;
    document.getElementById('result-desc').textContent = desc;
    document.getElementById('result-quip').textContent = quip;
    document.getElementById('result-drink').textContent = selectedDrink
      ? `음료: ${drinkNames[selectedDrink]}`
      : '음료 없이 깔끔하게';
    screens.build.classList.add('hidden');
    screens.result.classList.remove('hidden');
  });

  document.getElementById('btn-retry').addEventListener('click', () => {
    document.getElementById('stage-slot-build').appendChild(stageEl);
    screens.result.classList.add('hidden');
    screens.build.classList.remove('hidden');
  });

  function getTitle(){
    const s = state.sauce, p = state.powder, f = state.fresh;
    const total = s.size + p.size + f.size;

    if (s.has('sauce-buldak') && p.has('powder-cheese'))
      return { title:'매콤크리미파', desc:'불닭과 치즈는 이미 사랑입니다', quip:'이 조합 고른 거 보면 인생도 적당히 자극적인 걸 좋아하실 듯ㅎㅎ' };
    if (s.has('sauce-buldak'))
      return { title:'매콤한 모험가', desc:'한 입에 화끈한 스릴을 추구하는 타입', quip:'맵찔이는 아니신 듯, 오늘도 화끈하게 가봅시다' };
    if (total === 0)
      return { title:'순수주의자', desc:'토핑 없이도 자신있는 미니멀 라이프', quip:'아무것도 안 올렸는데 그게 더 용기있는 선택이에요ㅋㅋ' };
    if (total >= 7)
      return { title:'풀토핑 종결자', desc:'후회없이 다 올리고 보는 타입', quip:'어차피 한입인데 다 올리고 보는 거, 그게 인생이죠' };
    if (p.has('powder-cheese'))
      return { title:'치즈러버', desc:'치즈는 진리라고 믿는 타입', quip:'치즈 앞에서 망설이지 않는 거, 그거 멋진 거예요' };
    if (s.has('sauce-tako') && s.has('sauce-mayo') && p.has('powder-katsuo') && p.has('powder-parae') && total === 4)
      return { title:'정석 클래식파', desc:'기본이 최고라는 걸 아는 타입', quip:'기본기 챙기는 사람, 알고보면 제일 무서운 사람임ㅋㅋ' };
    if (f.has('fresh-pa'))
      return { title:'산뜻한 미니멀파', desc:'딱 하나만 더하는 센스있는 타입', quip:'과하지 않게 딱 하나, 그 센스 인정합니다' };

    return { title:'나만의 스타일파', desc:'정해진 답 없이 내 맘대로 가는 타입', quip:'정답 없는 거 알면서도 본인 스타일대로 가는 거, 그게 진짜 멋' };
  }
</script>
